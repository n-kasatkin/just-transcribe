# XcodeGen spec of just transcribe. scripts/bootstrap.sh fetches the ostt helper, runs
# `xcodegen generate` (the .xcodeproj is git-ignored) and copies the root Package.resolved in.
# After changing a package pin, run `xcodebuild -resolvePackageDependencies` and copy the
# project's Package.resolved back to the repo root.
name: JustTranscribe

options:
  bundleIdPrefix: dev.actionhook
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # 2.45.1 added Icon Composer (.icon) bundles; 2.46.0 is the version this project is tested with.
  minimumXcodeGenVersion: 2.46.0

settings:
  base:
    DEVELOPMENT_TEAM: 3V43DGM2S6
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  JustTranscribeKit:
    path: Packages/JustTranscribeKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0

targets:
  JustTranscribe:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
      # Contents/Resources/LICENSE and THIRD_PARTY_NOTICES.md (scripts/notices.sh writes it).
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: JustTranscribeKit
      - package: KeyboardShortcuts
    postBuildScripts:
      # Runs before Xcode signs the app, so the app's seal covers the signed helper.
      - name: Embed ostt helper
        script: '"${SRCROOT}/scripts/embed-ostt.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/embed-ostt.sh
          - $(SRCROOT)/vendor/ostt/ostt
          - $(SRCROOT)/vendor/ostt/LICENSE
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ostt
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/OSTT_LICENSE
    settings:
      base:
        PRODUCT_NAME: just transcribe
        PRODUCT_MODULE_NAME: JustTranscribe
        EXECUTABLE_NAME: just-transcribe
        PRODUCT_BUNDLE_IDENTIFIER: dev.actionhook.justtranscribe
        CODE_SIGN_ENTITLEMENTS: App/JustTranscribe.entitlements
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: just transcribe
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "just transcribe records your voice while you dictate and sends it to the transcription engine you chose."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Nikita Kasatkin · MIT License"
      configs:
        # Apple Development needs no provisioning profile here; the .dev id keeps Debug's
        # privacy grants apart from Release's.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.actionhook.justtranscribe.dev
          CODE_SIGN_IDENTITY: Apple Development
        # Local measurement without the cert: CODE_SIGN_IDENTITY="Apple Development"
        # DEVELOPMENT_TEAM=3V43DGM2S6 on the xcodebuild command line (the team signs package bundles).
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

schemes:
  JustTranscribe:
    build:
      targets:
        JustTranscribe: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: JustTranscribeKit/JustTranscribeKitTests
    run:
      config: Debug
    archive:
      config: Release
